name: android-debug

# Builds installable (debug-signed) Luanti APKs.
# Start it from the Actions tab with "Run workflow", or it runs
# automatically when this file changes.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build debug APKs with Gradle
      run: cd android; ./gradlew assembleDebug --stacktrace
    - name: List APKs
      run: ls -la android/app/build/outputs/apk/debug/
    - name: Save APKs
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-debug-apks
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 30
